<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV | Ehan Badenhorst</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="editorial-site">
    <nav aria-label="Main navigation">
        <h1><a href="home.html">Ehan B.</a></h1>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
            <span class="menu-label">Menu</span>
            <span class="menu-symbol" aria-hidden="true"><i></i><i></i></span>
        </button>
        <ul id="site-navigation">
            <li><a href="home.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="skills.html">Skills</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="cv.html" class="active" aria-current="page">CV</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Switch to dark mode" aria-pressed="false">
            <span class="theme-icon">🌙</span>
            <span class="theme-text">Dark</span>
        </button>
    </nav>

    <section>
        <h2>Curriculum Vitae</h2>
        <span class="section-subtitle">Professional Resume</span>

        <div class="cv-container">
            <a href="Ehan Badenhorst cv.png" target="_blank" rel="noopener noreferrer">
                <img src="Ehan Badenhorst cv.png" alt="Ehan Badenhorst Professional CV" class="cv-img">
            </a>
            <div style="margin-top: 2rem;">
                <a href="Ehan Badenhorst cv.png" download class="btn btn-primary">Download CV</a>
                <a href="contact.html" class="btn btn-secondary">Get In Touch</a>
            </div>
        </div>
    </section>

    <footer>
        &copy; 2026 Ehan Badenhorst | All Rights Reserved
    </footer>

    <script src="features.js"></script>
    <script>
        window.addEventListener('scroll', function() {
            const nav = document.querySelector('nav');
            if (window.scrollY > 50) {
                nav.classList.add('scrolled');
            } else {
                nav.classList.remove('scrolled');
            }
        });

        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            document.querySelector('.theme-icon').textContent = isDark ? '☀️' : '🌙';
            document.querySelector('.theme-text').textContent = isDark ? 'Light' : 'Dark';
            document.querySelector('.theme-toggle').setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
            document.querySelector('.theme-toggle').setAttribute('aria-pressed', String(isDark));
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
            document.querySelector('.theme-icon').textContent = '☀️';
            document.querySelector('.theme-text').textContent = 'Light';
            document.querySelector('.theme-toggle').setAttribute('aria-label', 'Switch to light mode');
            document.querySelector('.theme-toggle').setAttribute('aria-pressed', 'true');
        }
    </script>
</body>

</html>
